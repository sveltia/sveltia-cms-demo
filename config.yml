# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS demo site configuration
# https://sveltiacms.app/en/docs/config-basics
#
# The `test-repo` backend keeps everything in your browser’s origin private file system (OPFS).
# Nothing is sent to a server, and the sample content in `seed/` is copied there when you first
# sign in. To start over, choose Settings > Advanced > Erase All Data.

backend:
  name: test-repo

app_title: Sveltia CMS Demo
logo:
  src: /logo.svg

media_folder: static/images
public_folder: /images

output:
  omit_empty_optional_fields: true

i18n:
  structure: multiple_folders
  locales: [en, ja, fr]
  default_locale: en

collections:
  - name: posts
    label: Posts
    label_singular: Post
    description: Travel stories in English, Japanese and French. Open one to see the translations side by side.
    icon: article
    folder: content/posts
    i18n: true
    slug: "{{slug}}"
    summary: "{{title}} · {{date | date('MMM D, YYYY')}}"
    thumbnail: cover
    sortable_fields:
      fields: [title, date, author]
      default:
        field: date
        direction: descending
    view_filters:
      filters:
        - name: published
          label: Published
          field: draft
          pattern: false
        - name: drafts
          label: Drafts
          field: draft
          pattern: true
    view_groups:
      groups:
        - name: year
          label: Year
          field: date
          pattern: \d{4}
        - name: author
          label: Author
          field: author
    fields:
      - name: title
        label: Title
        i18n: true
      - name: date
        label: Published Date
        widget: datetime
        i18n: duplicate
      - name: draft
        label: Draft
        widget: boolean
        default: false
        i18n: duplicate
      - name: author
        label: Author
        widget: relation
        collection: authors
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        i18n: duplicate
      - name: tags
        label: Tags
        widget: select
        multiple: true
        options: [Coast, Forest, Mountains, Lakes, Cities, Desert, Night Sky, Tips]
        required: false
        i18n: duplicate
      - name: cover
        label: Cover Image
        widget: image
        required: false
        i18n: duplicate
      - name: description
        label: Description
        widget: text
        hint: A short summary shown in search results and social media cards.
        required: false
        i18n: true
      - name: body
        label: Body
        widget: richtext
        i18n: true

  - name: authors
    label: Authors
    label_singular: Author
    icon: group
    folder: content/authors
    extension: yml
    identifier_field: name
    summary: "{{name}} – {{role}}"
    thumbnail: avatar
    media_folder: /static/images/authors
    public_folder: /images/authors
    fields:
      - name: name
        label: Name
      - name: role
        label: Role
        required: false
      - name: avatar
        label: Avatar
        widget: image
        required: false
      - name: bio
        label: Bio
        widget: text
        required: false
      - name: links
        label: Links
        widget: list
        summary: "{{label}}"
        required: false
        fields:
          - name: label
            label: Label
          - name: url
            label: URL
            pattern: ["^https?://", Enter a URL starting with https://]

  - name: pages
    label: Pages
    label_singular: Page
    description: A nested collection. Pages live in folders, shown as a tree.
    icon: account_tree
    folder: content/pages
    nested:
      depth: 3
      summary: "{{title}}"
    meta:
      path:
        label: Path
        index_file: index
    summary: "{{title}}"
    thumbnail: cover
    fields:
      - name: title
        label: Title
      - name: cover
        label: Cover Image
        widget: image
        required: false
      - name: body
        label: Body
        widget: richtext
        required: false

  - divider: true

  - name: examples
    label: Field Types
    label_singular: Field Type
    description: One file per built-in field type, each showing its main options. Change anything; it’s your sandbox.
    icon: widgets
    editor:
      preview: false
    files:
      - name: boolean
        label: Boolean
        icon: toggle_on
        file: content/examples/boolean.yml
        fields:
          - name: plain
            label: Plain
            widget: boolean
            required: false
          - name: default_on
            label: On by Default
            widget: boolean
            default: true
            hint: "`default: true` turns it on in a new entry."
            required: false
          - name: labeled
            label: With Labels
            widget: boolean
            before_input: Hide
            after_input: Show
            hint: "`before_input` and `after_input` label the two states."
            required: false

      - name: code
        label: Code
        icon: code
        file: content/examples/code.yml
        fields:
          - name: snippet
            label: With Language
            widget: code
            default_language: js
            hint: Saved as an object with the `code` and `lang` properties.
            required: false
          - name: css
            label: Code Only
            widget: code
            default_language: css
            allow_language_selection: false
            output_code_only: true
            hint: "`output_code_only` saves just the code, and `allow_language_selection: false` hides the language menu."
            required: false

      - name: color
        label: Color
        icon: palette
        file: content/examples/color.yml
        fields:
          - name: plain
            label: Plain
            widget: color
            required: false
          - name: input
            label: With Text Input
            widget: color
            allowInput: true
            hint: "`allowInput: true` lets you type a hex value."
            required: false
          - name: alpha
            label: With Alpha
            widget: color
            allowInput: true
            enableAlpha: true
            hint: "`enableAlpha: true` adds an opacity slider."
            required: false

      - name: compute
        label: Compute
        icon: function
        file: content/examples/compute.yml
        fields:
          - name: first_name
            label: First Name
            hint: >-
              A Compute field is hidden in the editor. On save, this entry’s `full_name` is computed
              from `{{fields.first_name}} {{fields.last_name}}`.
            required: false
          - name: last_name
            label: Last Name
            required: false
          - name: full_name
            label: Full Name
            widget: compute
            value: "{{fields.first_name}} {{fields.last_name}}"
          - name: stops
            label: Stops
            label_singular: Stop
            widget: list
            summary: "{{name}}"
            hint: Each stop gets a hidden `number`, computed from `{{index}}`, its position in the list.
            required: false
            fields:
              - name: name
                label: Name
              - name: number
                label: Stop Number
                widget: compute
                value: "{{index}}"

      - name: datetime
        label: DateTime
        icon: calendar_month
        file: content/examples/datetime.yml
        fields:
          - name: datetime
            label: Date & Time
            widget: datetime
            hint: Saved as an ISO 8601 string in the local time zone.
            required: false
          - name: date
            label: Date Only
            widget: datetime
            time_format: false
            hint: "`time_format: false` hides the time input."
            required: false
          - name: time
            label: Time Only
            widget: datetime
            date_format: false
            hint: "`date_format: false` hides the date input."
            required: false
          - name: formatted
            label: Custom Format
            widget: datetime
            format: YYYY/MM/DD HH:mm
            hint: "`format` sets the stored format, written in Day.js tokens."
            required: false
          - name: utc
            label: UTC
            widget: datetime
            picker_utc: true
            hint: "`picker_utc` enters and saves the time in UTC."
            required: false
          - name: updated
            label: Auto Now
            widget: datetime
            auto_now: [create, update]
            hint: "`auto_now` fills in the current time when the entry is created and saved."
            required: false

      - name: file
        label: File
        icon: attach_file
        file: content/examples/file.yml
        media_folder: /static/files
        public_folder: /files
        fields:
          - name: single
            label: Single
            widget: file
            hint: This entry uses the Downloads folder with the file-level `media_folder` option.
            required: false
          - name: multiple
            label: Multiple
            widget: file
            multiple: true
            required: false
          - name: gpx
            label: GPX Only
            widget: file
            accept: .gpx
            hint: "`accept: .gpx` limits the file types."
            required: false

      - name: hidden
        label: Hidden
        icon: visibility_off
        file: content/examples/hidden.yml
        fields:
          - name: note
            label: Visible Field
            widget: text
            hint: This entry also has two Hidden fields, `layout` and `id`, which aren’t shown in the editor but are still saved in the file.
            required: false
          - name: layout
            label: Layout
            widget: hidden
            default: example
          - name: id
            label: ID
            widget: hidden
            default: "{{uuid_short}}"

      - name: image
        label: Image
        icon: image
        file: content/examples/image.yml
        fields:
          - name: single
            label: Single
            widget: image
            hint: Upload an image, pick one from the Assets, or enter a URL.
            required: false
          - name: gallery
            label: Multiple
            widget: image
            multiple: true
            max: 6
            hint: "`multiple: true` with `max: 6`. Drag to reorder."
            required: false
          - name: svg
            label: SVG Only, No URL
            widget: image
            accept: image/svg+xml
            choose_url: false
            hint: "`accept` limits the file types, and `choose_url: false` hides the URL input."
            required: false

      - name: keyvalue
        label: KeyValue
        icon: table_rows
        file: content/examples/keyvalue.yml
        fields:
          - name: plain
            label: Plain
            widget: keyvalue
            required: false
          - name: labeled
            label: Custom Labels
            label_singular: Header
            widget: keyvalue
            key_label: Header Name
            value_label: Header Value
            hint: "`key_label`, `value_label` and `label_singular` change the column and button labels."
            required: false

      - name: list
        label: List
        icon: format_list_bulleted
        file: content/examples/list.yml
        fields:
          - name: strings
            label: Strings
            widget: list
            hint: Without `field`, `fields` or `types`, each item is a string.
            required: false
          - name: single_field
            label: Single Subfield
            label_singular: Country
            widget: list
            hint: "`field` gives each item one field. The values are saved as a plain list."
            required: false
            field:
              name: country
              label: Country
              widget: select
              options: [Canada, France, Iceland, Japan, New Zealand, Norway, Peru, Scotland]
          - name: stops
            label: Subfields
            label_singular: Stop
            widget: list
            summary: "{{name}} ({{distance}} km)"
            thumbnail: photo
            hint: "`fields` gives each item a set of subfields, with `summary` and `thumbnail` for the collapsed view."
            required: false
            fields:
              - name: name
                label: Name
              - name: distance
                label: Distance
                widget: number
                value_type: float
                after_input: km
                required: false
              - name: photo
                label: Photo
                widget: image
                required: false
          - name: highlights
            label: Limits
            label_singular: Highlight
            widget: list
            min: 1
            max: 3
            add_to_top: true
            collapsed: false
            hint: "`min` and `max` limit the number of items. `add_to_top` adds new items at the top."
            required: false
            fields:
              - name: text
                label: Text
          - name: blocks
            label: Variable Types
            label_singular: Block
            widget: list
            hint: "`types` lets you pick a kind of item, like page builder blocks."
            required: false
            types:
              - name: heading
                label: Heading
                summary: "{{text}}"
                fields:
                  - name: text
                    label: Text
              - name: quote
                label: Quote
                summary: "{{author}}"
                fields:
                  - name: quote
                    label: Quote
                    widget: text
                  - name: author
                    label: Author
              - name: photo
                label: Photo
                summary: "{{caption}}"
                fields:
                  - name: src
                    label: Image
                    widget: image
                  - name: caption
                    label: Caption
                    required: false

      - name: map
        label: Map
        icon: map
        file: content/examples/map.yml
        fields:
          - name: point
            label: Point
            widget: map
            center: [3.2247, 51.2093]
            zoom: 12
            hint: Click the map to place a point. Search for a place or use your location in the toolbar.
            required: false
          - name: route
            label: Line
            widget: map
            type: LineString
            decimals: 5
            hint: "`type: LineString` draws a route. `decimals` sets the precision of the coordinates."
            required: false
          - name: area
            label: Polygon
            widget: map
            type: Polygon
            hint: "`type: Polygon` draws an area."
            required: false

      - name: number
        label: Number
        icon: pin
        file: content/examples/number.yml
        fields:
          - name: integer
            label: Integer
            widget: number
            value_type: int
            min: 1
            max: 10
            hint: "`value_type: int` with `min` and `max`."
            required: false
          - name: float
            label: Float
            widget: number
            value_type: float
            step: 0.1
            after_input: km
            hint: "`value_type: float` with a `step` and an `after_input` label."
            required: false
          - name: price
            label: Number as String
            widget: number
            value_type: float/string
            before_input: $
            hint: "`value_type: float/string` saves the number as a string, like `\"9.99\"`."
            required: false

      - name: object
        label: Object
        icon: data_object
        file: content/examples/object.yml
        fields:
          - name: contact
            label: Subfields
            widget: object
            summary: "{{name}}"
            hint: A group of subfields. Collapse it to see the `summary`.
            required: false
            fields:
              - name: name
                label: Name
              - name: email
                label: Email
                type: email
                required: false
          - name: location
            label: Collapsed
            widget: object
            collapsed: true
            summary: "{{city}}, {{country}}"
            hint: "`collapsed: true` hides the subfields by default."
            required: false
            fields:
              - name: city
                label: City
              - name: country
                label: Country
          - name: media
            label: Variable Types
            widget: object
            hint: "`types` lets you choose one of several sets of subfields."
            required: false
            types:
              - name: photo
                label: Photo
                fields:
                  - name: src
                    label: Image
                    widget: image
                  - name: alt
                    label: Alt Text
                    required: false
              - name: video
                label: Video
                fields:
                  - name: url
                    label: YouTube URL
                    type: url

      - name: relation
        label: Relation
        icon: link
        file: content/examples/relation.yml
        fields:
          - name: author
            label: Single Entry
            widget: relation
            collection: authors
            value_field: "{{slug}}"
            search_fields: [name]
            display_fields: ["{{name}} – {{role}}"]
            hint: Picks an entry from another collection, here Authors. `display_fields` can be a template.
            required: false
          - name: posts
            label: Multiple Entries
            widget: relation
            collection: posts
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            multiple: true
            hint: "`multiple: true` allows multiple entries."
            required: false
          - name: drafts
            label: Filtered
            widget: relation
            collection: posts
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            filters:
              - field: draft
                values: [true]
            hint: "`filters` limits the options, here to draft posts."
            required: false
          - name: menu_item
            label: Singleton List Items
            widget: relation
            collection: _singletons
            file: navigation
            value_field: items.*.url
            search_fields: [items.*.label]
            display_fields: [items.*.label]
            hint: Picks an item from a list in a singleton, here the Navigation menu items.
            required: false

      - name: richtext
        label: RichText
        icon: article
        file: content/examples/richtext.yml
        fields:
          - name: markdown
            label: Markdown
            widget: richtext
            hint: Switch between the rich text and Markdown modes with the toolbar menu.
            required: false
          - name: html
            label: HTML
            widget: richtext
            format: html
            buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, align]
            hint: "`format: html` saves HTML instead of Markdown, and enables the `align` button."
            required: false
          - name: minimal
            label: Minimal
            widget: richtext
            minimal: true
            buttons: [bold, italic, link]
            editor_components: []
            hint: "`minimal` limits the height, while `buttons` and `editor_components` limit the toolbar."
            required: false
          - name: raw
            label: Markdown Only
            widget: richtext
            modes: [raw]
            hint: "`modes: [raw]` shows the plain Markdown editor only."
            required: false

      - name: select
        label: Select
        icon: list_alt
        file: content/examples/select.yml
        fields:
          - name: radio
            label: Radio Buttons
            widget: select
            options:
              - { label: Spring, value: spring }
              - { label: Summer, value: summer }
              - { label: Autumn, value: autumn }
              - { label: Winter, value: winter }
            hint: Up to 5 options are shown as radio buttons. Options can have labels and values.
            required: false
          - name: dropdown
            label: Dropdown
            widget: select
            options: [Canada, France, Iceland, Japan, New Zealand, Norway, Peru, Scotland]
            hint: More options are shown in a dropdown list. Change it with `dropdown_threshold`.
            required: false
          - name: checkboxes
            label: Checkboxes
            widget: select
            multiple: true
            options: [Hiking, Cycling, Kayaking, Camping]
            hint: "`multiple: true` allows multiple choices."
            required: false
          - name: multiple
            label: Multiple with Limits
            widget: select
            multiple: true
            min: 1
            max: 3
            options: [Hiking, Cycling, Kayaking, Climbing, Camping, Photography, Birdwatching, Skiing]
            hint: "`min` and `max` limit the number of choices."
            required: false

      - name: string
        label: String
        icon: short_text
        file: content/examples/string.yml
        fields:
          - name: plain
            label: Plain
            hint: The default field type, used when `widget` is omitted.
          - name: url
            label: URL
            type: url
            hint: "`type: url` checks the value is a URL."
            required: false
          - name: email
            label: Email
            type: email
            hint: "`type: email` checks the value is an email address."
            required: false
          - name: handle
            label: Before & After Input
            before_input: "@"
            after_input: .bsky.social
            hint: "`before_input` and `after_input` add labels around the input. They’re not saved."
            required: false
          - name: tag
            label: Prefix & Suffix
            prefix: "#"
            hint: "`prefix` and `suffix` are saved with the value: type `travel` and `#travel` is stored."
            required: false
          - name: headline
            label: Character Count
            minlength: 10
            maxlength: 60
            hint: "`minlength` and `maxlength` show a character counter."
            required: false
          - name: code
            label: Pattern
            pattern: ['^[A-Z]{3}$', 'Enter a three-letter airport code, like YVR']
            hint: "`pattern` validates the value with a regular expression."
            required: false
          - name: readonly
            label: Read-Only
            readonly: true
            required: false

      - name: text
        label: Text
        icon: notes
        file: content/examples/text.yml
        fields:
          - name: plain
            label: Plain
            widget: text
            hint: A multiline text area. Line breaks are kept as is.
            required: false
          - name: limited
            label: Character Count
            widget: text
            minlength: 20
            maxlength: 160
            hint: "`minlength` and `maxlength` show a character counter, handy for a meta description."
            required: false
          - name: emoji
            label: Emoji Autocomplete
            widget: text
            use_emoji_autocomplete: true
            hint: "With `use_emoji_autocomplete`, type `:` followed by a name, like `:sun`."
            required: false

      - name: uuid
        label: UUID
        icon: fingerprint
        file: content/examples/uuid.yml
        fields:
          - name: plain
            label: Plain
            widget: uuid
          - name: prefixed
            label: Prefix & Base32
            widget: uuid
            prefix: "trip-"
            use_b32_encoding: true
            readonly: false
            hint: >-
              A UUID is generated when an entry is created, and is read-only by default like the one
              above. This one uses `prefix`, `use_b32_encoding` for a shorter value, and
              `readonly: false`.

  - name: api
    label: API Examples
    label_singular: API Example
    description: Examples of the JavaScript API, defined in `api.js`. See the Demo Guide page in the toolbar for an overview.
    icon: code_blocks
    editor:
      preview: false
    files:
      - name: postcard
        label: Custom Preview Styles & Templates
        icon: preview
        file: content/api/postcard.yml
        editor:
          preview: true
        fields:
          - name: photo
            label: Photo
            widget: image
            hint: >-
              The preview pane shows a postcard, rendered by a template registered with
              `CMS.registerPreviewTemplate()` and styled with `CMS.registerPreviewStyle()`.
            required: false
          - name: message
            label: Message
            widget: richtext
            minimal: true
            required: false
          - name: to
            label: To
            required: false
          - name: from
            label: From
            required: false

      - name: editor-components
        label: Custom Editor Components
        icon: widgets
        file: content/api/editor-components.yml
        fields:
          - name: body
            label: Markdown
            widget: richtext
            hint: >-
              Six components are registered with `CMS.registerEditorComponent()`. Add them from the
              Insert menu, except Status, which has its own toolbar button. Switch to the Markdown
              mode in the toolbar menu to see how they’re saved.
          - name: html_body
            label: HTML
            widget: richtext
            format: html
            editor_components: [figure]
            hint: >-
              Image with Caption also defines an HTML syntax, so it works in a RichText field with
              `format: html`. `editor_components` limits this field to that component.
            required: false

      - name: field-types
        label: Custom Field Types
        icon: star
        file: content/api/field-types.yml
        fields:
          - name: rating
            label: Rating
            widget: rating
            hint: >-
              A custom `rating` field type registered with `CMS.registerFieldType()`, saved as a
              number.
            required: false
          - name: rating_10
            label: Rating out of 10
            widget: rating
            max: 10
            hint: The custom `max` option is validated with the field type’s JSON schema.
            required: false
          - name: trails
            label: Trail Ratings
            label_singular: Rating
            widget: list
            collapsed: true
            hint: The collapsed items show the field type’s summary component.
            required: false
            field:
              name: stars
              label: Stars
              widget: rating

      - name: string-transformations
        label: Custom String Transformations
        icon: text_format
        file: content/api/string-transformations.yml
        fields:
          - name: name
            label: Name
            hint: >-
              A custom `initials` transformation is registered with
              `CMS.registerStringTransformation()`. On save, a hidden Compute field stores
              `{{fields.name | initials}}`.
          - name: initials
            label: Initials
            widget: compute
            value: "{{fields.name | initials}}"
          - name: team
            label: Team
            label_singular: Member
            widget: list
            collapsed: true
            summary: "{{name | initials}} – {{name}}"
            hint: The collapsed list items use the same transformation in their summary.
            required: false
            fields:
              - name: name
                label: Name

      - name: events
        label: Event Hooks
        icon: bolt
        file: content/api/events.yml
        fields:
          - name: note
            label: Note
            widget: text
            hint: >-
              Edit this note and save. A `preSave` hook registered with
              `CMS.registerEventListener()` updates the two fields below, and a `postSave` hook
              logs a message to the browser console.
            required: false
          - name: save_count
            label: Save Count
            widget: number
            value_type: int
            readonly: true
            required: false
          - name: last_saved
            label: Last Saved
            widget: datetime
            readonly: true
            required: false

singletons:
  - name: site
    label: Site Settings
    icon: settings
    file: data/site.yml
    i18n:
      structure: single_file
    fields:
      - name: title
        label: Site Title
        i18n: true
      - name: tagline
        label: Tagline
        i18n: true
      - name: logo
        label: Logo
        widget: image
        required: false
      - name: social
        label: Social Links
        widget: list
        summary: "{{platform}}"
        required: false
        fields:
          - name: platform
            label: Platform
            widget: select
            options: [Bluesky, GitHub, Instagram, Mastodon, YouTube]
          - name: url
            label: URL
  - name: navigation
